<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>КД-Групп ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600&display=swap">
<style>
/* Раскладка: шапка с ролями и одна рабочая поверхность; график — таблицей как в Excel, на узком экране карточками; режим показа — офис и телефон рядом */
:root{
  --bg:#f2f4f2;--surface:#ffffff;--surface-2:#f6f8f6;--line:#e0e5e1;--line-strong:#c8cfca;
  --ink:#161616;--ink-2:#58605b;--ink-3:#8e8e8e;
  --kd:#36895f;--kd-deep:#00552f;--kd-ink:#00552f;--kd-tint:#e4f1e9;--kd-row:#eff7f2;--on-kd:#ffffff;
  --prog:#1f5f9e;--prog-tint:#e6eef8;--warn:#875200;--warn-tint:#fff2d4;--warn-line:#ebc77c;--bad:#b42318;--bad-tint:#fdeceb;--bad-line:#f1b9b4;
  --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1311;--surface:#171c19;--surface-2:#1e2420;--line:#2a322d;--line-strong:#3b453f;--ink:#e8eeea;--ink-2:#a7b1ab;--ink-3:#7c8680;--kd-ink:#8fd1ad;--kd-tint:#183a2a;--kd-row:#132a1e;--prog:#8db8f0;--prog-tint:#1b2a3f;--warn:#f2c46b;--warn-tint:#3a2e12;--warn-line:#6b5320;--bad:#ff8a80;--bad-tint:#3a1714;--bad-line:#6b2a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1311;--surface:#171c19;--surface-2:#1e2420;--line:#2a322d;--line-strong:#3b453f;--ink:#e8eeea;--ink-2:#a7b1ab;--ink-3:#7c8680;--kd-ink:#8fd1ad;--kd-tint:#183a2a;--kd-row:#132a1e;--prog:#8db8f0;--prog-tint:#1b2a3f;--warn:#f2c46b;--warn-tint:#3a2e12;--warn-line:#6b5320;--bad:#ff8a80;--bad-tint:#3a1714;--bad-line:#6b2a25;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1920px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
@media (min-width:900px){.wrap{padding-inline:24px}}
.narrow{max-width:1240px;margin-inline:auto}
.cq{container-type:inline-size;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
button:hover{background:var(--surface-2)}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--kd);outline-offset:2px}
.pri{background:var(--kd);border-color:var(--kd);color:var(--on-kd)}
.pri:hover{background:var(--kd-deep);border-color:var(--kd-deep)}
.ghost{border-color:transparent;background:transparent}
.danger{color:var(--bad);border-color:var(--bad-line)}
.danger.pri,.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--on-kd)}
button.lnk{border:none;background:none;padding:0;min-height:0;color:var(--kd-ink);text-decoration:underline;text-underline-offset:2px;font-size:inherit;font-weight:500;white-space:normal}
input,select,textarea{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface)}
textarea{resize:vertical}
input[type=checkbox]{width:16px;height:16px;min-height:0;padding:0;flex:none;accent-color:var(--kd)}
::placeholder{color:var(--ink-3)}
a{color:var(--kd-ink)}
.ic{flex:none;vertical-align:-3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:18px 20px}
.mu{color:var(--ink-2);font-size:13px}
.sm{font-size:12.5px;color:var(--ink-2)}
.b1{font-weight:600;font-size:14px}
.lb{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 6px}
.er{color:var(--bad);font-size:13px;margin-top:8px}
.bad{color:var(--bad)}
.fl{color:var(--warn)}
.data{font-family:var(--font-data);font-size:.9em;font-variant-numeric:tabular-nums}
.h2{font-size:18px;font-weight:600;margin:0;text-wrap:balance}
.h3{font-size:15px;font-weight:600;margin:0}
.mt{margin:24px 0 10px}
.num{display:inline-block;font-family:var(--font-data);font-weight:500;font-size:.82em;line-height:1.5;padding:0 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-strong);margin-right:7px;white-space:nowrap;vertical-align:1px;color:var(--ink)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--kd-deep);color:var(--on-kd);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.brand{display:flex;align-items:center;gap:10px}
.tag{margin-left:auto;font-size:11px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--warn-tint);color:var(--warn)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.nav{display:flex;gap:4px;flex:1;min-width:0}
.tab{border:none;background:transparent;min-height:36px;padding:0 12px;color:var(--ink-2)}
.tab.on{background:var(--kd-tint);color:var(--kd-ink)}
.who{text-align:right;line-height:1.35}
.login{display:flex;justify-content:center;padding-block:4vh}
.lc{width:100%;max-width:400px}
.wide-b{width:100%;margin-top:16px}
.pw{position:relative}
.pw input{padding-right:96px}
.pw button{position:absolute;right:4px;top:4px;min-height:32px;padding:0 10px;font-size:13px;border-color:transparent;background:transparent;color:var(--kd-ink)}
.lhint{font-size:13px;color:var(--warn);margin-top:6px}
.demo{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dg button{font-size:13px;white-space:normal;text-align:center;min-height:42px;line-height:1.25}
.dg .duo-b{grid-column:1/-1}
.polb{margin-top:10px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 240px;min-width:0}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:36px}
select.auto{width:auto;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:none;border-radius:0;min-height:36px;font-size:13px;padding:0 12px}
.seg button.on{background:var(--kd-tint);color:var(--kd-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{min-height:32px;padding:0 12px;font-size:13px;border-radius:999px}
.chip.on{background:var(--kd-tint);border-color:var(--kd);color:var(--kd-ink)}
.chip .n{color:var(--ink-2);font-weight:400}
.chip.warn .n{color:var(--warn)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toast{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--kd-tint);color:var(--kd-ink);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-bottom:10px;flex-wrap:wrap}
.toast .tb{display:flex;gap:6px}
.sm-btn{min-height:28px;padding:0 10px;font-size:12px}
/* «Сегодня из Брянска» */
.today{padding:14px 16px;margin:0 0 14px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px 20px}
.today .th{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;grid-column:1/-1}
.tl{display:flex;flex-direction:column}
.tl button{justify-content:flex-start;border:none;background:transparent;min-height:30px;padding:2px 6px;margin-inline:-6px;font-weight:400;font-size:13px;white-space:normal;text-align:left;gap:8px}
.tl button:hover{background:var(--surface-2)}
.tl .tm{font-family:var(--font-data);color:var(--ink-2);font-size:12px;flex:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.kpis button{flex-direction:column;align-items:flex-start;gap:0;min-height:52px;padding:6px 12px;font-weight:400;font-size:12.5px;color:var(--ink-2);white-space:normal;text-align:left}
.kpis b{font-size:18px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.kpis .w b{color:var(--warn)}.kpis .x b{color:var(--bad)}
.new{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--kd);color:var(--on-kd);margin-left:4px;white-space:nowrap}
/* таблица */
.gwrap{position:relative}
.tbl{overflow:auto;max-height:calc(100vh - 190px);min-height:280px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;min-width:100%}
thead th{position:sticky;z-index:2;background:var(--surface-2)}
thead tr.sumr th{top:0;height:30px;font-weight:500;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
thead tr.sumr th.s{color:var(--ink);font-family:var(--font-data)}
thead tr.hdr th{top:30px;text-align:left;font-weight:500;border-bottom:1px solid var(--line-strong);padding:4px 4px;vertical-align:bottom}
td{padding:8px 8px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface)}
tbody tr{cursor:pointer}
tbody tr:hover td,tbody tr:focus-visible td{background:var(--surface-2)}
tr.rdy td{background:var(--kd-row)}
tr.shp td{color:var(--ink-2)}
tr.cxr td{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
tr.cxr td:first-child,tr.cxr td:nth-child(2){text-decoration:none}
tr.hl td{background:var(--kd-tint)}
.hb{border:none;background:transparent;min-height:30px;padding:2px 4px;font-size:12px;color:var(--ink-2);gap:2px;white-space:normal;text-align:left;line-height:1.2;justify-content:flex-start;align-items:flex-end;width:100%}
.hb.act,.hb.open{color:var(--kd-ink)}
.hb.open{background:var(--kd-tint)}
.fcell{display:inline-flex;gap:4px;align-items:center}
.rqn{opacity:.55}
.qm{color:var(--prog)}
.pl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pl.s0{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.pl.sp{background:var(--prog-tint);color:var(--prog)}
.pl.s5{background:var(--kd-tint);color:var(--kd-ink)}
.pl.s6{background:transparent;color:var(--ink-2);border-color:var(--line)}
.pl.cx{background:var(--bad-tint);color:var(--bad)}
button.on-fl,.pl.on-fl{background:var(--warn-tint);color:var(--warn);border-color:var(--warn-line)}
.tot{margin-top:10px}
.fpop{position:absolute;z-index:30;top:0;left:0;width:330px;max-height:470px;display:flex;flex-direction:column;gap:8px;padding:12px 14px;box-shadow:0 10px 30px rgb(0 0 0 / .16)}
.fph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fsort,.fbt{display:flex;gap:6px;flex-wrap:wrap}
.fsort button{min-height:30px;font-size:12.5px;padding:0 10px}
.fsort button.on{background:var(--kd-tint);border-color:var(--kd);color:var(--kd-ink)}
.fbt{gap:14px;font-size:13px}
.fvals{overflow:auto;min-height:60px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.fvals label{display:flex;gap:8px;align-items:center;min-width:0;cursor:pointer;padding:3px 2px}
.fvals .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fvals .c{color:var(--ink-2);margin-left:auto;font-family:var(--font-data);font-size:12px}
.fok{display:flex;justify-content:flex-end}
.flist{display:flex;flex-direction:column}
.frow{justify-content:space-between;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;min-height:44px;padding:0 2px;font-weight:400}
.mob,.mob-inline{display:none}
.mcard{padding:12px 14px;margin-bottom:8px;cursor:pointer}
.mcard.rdy{background:var(--kd-row)}
.mcard.shp .mt-t{color:var(--ink-2)}
.mcard.cxr{opacity:.7}
.mcard.hl{border-color:var(--kd);background:var(--kd-tint)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mt-t{font-weight:600;font-size:15px;margin:4px 0 2px}
.oform{margin-bottom:14px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 12px}
.zbox{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--surface-2)}
.zbox summary{cursor:pointer;font-size:14px;font-weight:500}
.zbox .zs{color:var(--kd-ink);font-weight:400;font-size:13px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px;margin-top:14px}
.k{font-size:12px;color:var(--ink-2)}
.v{font-size:14px;overflow-wrap:anywhere}
.box{margin-top:14px;padding:12px 14px;border-radius:var(--r);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.box.w{background:var(--warn-tint);color:var(--warn);border:1px solid var(--warn-line)}
.box.x{background:var(--bad-tint);color:var(--bad);border:1px solid var(--bad-line)}
.box.g{background:var(--kd-tint);color:var(--kd-ink)}
.box .bb{display:flex;gap:8px;flex-wrap:wrap}
.cdrow{margin-top:14px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.cdrow>div:first-child{flex:0 1 220px}
.cdrow .sm{flex:1 1 220px;padding-bottom:4px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:24px 0 12px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.stp{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:transparent;padding:0;min-height:0;font-weight:400;white-space:normal;min-width:0}
.stp:hover{background:transparent}
.stp .dt{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);position:relative;z-index:1}
.stp .ln{position:absolute;top:7px;right:50%;width:100%;height:2px;background:var(--line-strong)}
.stp:first-child .ln{display:none}
.stp.done .dt{background:var(--kd);border-color:var(--kd)}
.stp.done .ln{background:var(--kd)}
.stp .tx{font-size:12px;color:var(--ink-2);text-align:center;line-height:1.25;margin-top:2px}
.stp .dd{font-size:11px;color:var(--ink-2);font-family:var(--font-data)}
.stp.cur .tx{color:var(--kd-ink);font-weight:600}
.stp.cur .dt{box-shadow:0 0 0 4px var(--kd-tint)}
button.stp:hover .dt{border-color:var(--kd)}
.cfb{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--warn-tint);border:1px solid var(--warn-line);font-size:14px}
.cfb .acts{margin-top:10px}
.alt{margin:12px 0 0;font-size:13px}
.hist{font-size:13px}
.hist>div{padding:7px 0;border-bottom:1px solid var(--line)}
.cm{display:flex;gap:8px;margin-top:12px;align-items:flex-start}
.cm input,.cm textarea{flex:1;min-width:0}
.thread{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{padding:8px 12px;border-radius:12px;font-size:14px;max-width:92%}
.msg.client{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start}
.msg.office{background:var(--kd-tint);color:var(--ink);align-self:flex-end}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
.slist .sc{margin-bottom:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sc{padding:12px 14px;margin-bottom:8px}
.sc.hl{border-color:var(--kd)}
.prog{display:flex;align-items:center;gap:8px;margin:10px 0}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--kd)}
.sa{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.phone .sa button,.pr .sa button{min-height:48px;font-size:16px;font-weight:600}
.phone .sa .pri,.pr .sa .pri{background:var(--kd-deep);border-color:var(--kd-deep)}
.sq{width:48px;padding:0;flex:none}
.sdone{flex:1;display:flex;gap:8px;align-items:center;min-height:48px;padding:0 12px;border-radius:var(--r);background:var(--kd-tint);color:var(--kd-ink);font-size:14px}
.sundo{min-height:48px}
.scf{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:var(--r);background:var(--warn-tint);border:1px solid var(--warn-line)}
.scf .sm{color:var(--warn);font-size:13.5px}
.empty{padding:20px;text-align:center;color:var(--ink-2);font-size:13px}
.agrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.acc{margin:12px 0;padding:14px;border-radius:var(--r);background:var(--kd-tint);color:var(--kd-ink)}
.acc textarea{background:var(--surface);color:var(--ink);font-size:13px;resize:none;margin-top:8px}
.acc .row2{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lrow .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.ct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.asb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--prog-tint);color:var(--prog);font-size:13.5px;margin-bottom:14px}
.asb span{flex:1;min-width:200px}
.mine{max-width:640px;margin:0 auto}
.readyb{margin:16px 0 6px;padding:14px 16px;border-radius:14px;background:var(--kd-tint);color:var(--kd-ink);border:1px solid var(--kd)}
.rbh{display:flex;gap:8px;align-items:center;font-size:17px;font-weight:600}
.rbl{display:flex;flex-direction:column;gap:4px;margin:10px 0 12px;color:var(--ink);font-size:14px}
.readyb .sm{color:var(--ink-2)}
.ctabs{margin:16px 0 2px}
.cc{padding:14px 16px;margin-bottom:10px}
.cc.rdy{border-color:var(--kd)}
.cct{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cc-n{font-weight:600;font-size:15px;min-width:0}
.now{font-size:16px;font-weight:600;margin-top:12px}
.eta{font-size:14px;color:var(--ink-2);margin-top:2px}
.cc .prog{margin:10px 0 12px}
.csteps{margin:4px 0 6px}
.cact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cact button{min-height:40px}

function tick(){clearTimeout(TK);const now=Date.now();const ts=Object.values(PEND).concat(P.filter(isFlash).map(p=>p.flash+15000)).filter(t=>t>now);if(!ts.length)return;TK=setTimeout(()=>{const n=Date.now();for(const k in PEND)if(PEND[k]<=n)delete PEND[k];render();tick()},Math.min(...ts)-now+60)}

/* ---------- стадии ---------- */
function setStage(p,to){if(!p||to<0||to>6||to===p.st)return false;
  UNDO[p.id]={st:p.st,rd:p.rd,sd:p.sd,sdx:p.sdx,sdt:p.sdt.slice()};const from=p.st;p.st=to;
  if(to>from){for(let i=from+1;i<=to;i++)p.sdt[i]=TODAY}else{for(let i=to+1;i<7;i++)p.sdt[i]=''}
  if(to>=5){if(!p.rd)p.rd=TODAY}else p.rd='';
  if(to===6)p.sd=TODAY;else{p.sd='';p.sdx=''}
  p.h.push(ev(route(p)[from]+' → '+route(p)[to]));touch(p);return true}
function undoStage(id){const u=UNDO[id],p=byId(id);if(!u||!p)return;const from=p.st;Object.assign(p,{st:u.st,rd:u.rd,sd:u.sd,sdx:u.sdx,sdt:u.sdt});delete UNDO[id];delete PEND[id];p.h.push(ev('отменено: '+route(p)[from]+' → '+route(p)[p.st]));touch(p)}
function askStage(p,to){if(to===p.st)return render();if(to===5||to-p.st>1){S.cf={id:p.id,to};return render()}doStage(p,to)}
function doStage(p,to){const from=p.st;if(!setStage(p,to))return render();S.cf=null;S.toast={m:`${tag(p)}: ${route(p)[from]} → ${route(p)[to]}`+(S.u.role==='shift'?'. Офис и клиент видят без звонка':''),u:p.id};render()}

/* ---------- выборка графика ---------- */
const CHIPS={all:()=>true,prod,ready:p=>p.st===5&&!p.cx,ship:p=>p.st===6&&!p.cx,cx:p=>!!p.cx,over,prio:p=>prio(p)&&prod(p),rq:rqNew,msg:unans,today:p=>p.h.some(h=>h.d===TODAY&&h.r==='shift')};
function rows(skip){const q=S.q.trim().toLowerCase();const ch=CHIPS[S.chip]||CHIPS.all;return P.filter(p=>{if(!ch(p))return false;if(q&&![p.cl,p.nm,p.art,p.inv,p.br,p.num].join(' ').toLowerCase().includes(q))return false;for(const k in S.f){if(k===skip)continue;const c=col(k);if(!S.f[k].has((c.fv||c.v)(p)))return false}return true})}
const grp=p=>p.cx?3:p.st<5?0:p.st===5?1:2;
function cmpDef(a,b){const ga=grp(a);return ga-grp(b)||(ga===0?(prio(b)-prio(a)||over(b)-over(a)||ru(a.plan||'9999',b.plan||'9999')):ga===1?ru(b.rd||'',a.rd||''):ru(b.sd||'',a.sd||''))||a.id-b.id}
function sorted(a){if(!S.sort)return a.sort(cmpDef);const c=col(S.sort.k),d=S.sort.dir==='asc'?1:-1;const val=p=>c.dt?(p[c.k]||''):c.s?c.s(p):c.v(p);return a.sort((x,y)=>{const vx=val(x),vy=val(y);const ex=vx===''||vx==='—',ey=vy===''||vy==='—';if(ex!==ey)return ex?1:-1;return d*ru(vx,vy)||x.id-y.id})}
function fvSort(c){if(c.dt)return (a,b)=>{const k=v=>/^\d\d\.\d{4}$/.test(v)?v.slice(3)+v.slice(0,2):'0';return ru(k(b),k(a))};return ru}

${S.oerr?`<div class="er">${esc(S.oerr)}</div>`:''}
<div class="acts"><button data-a="osave" class="pri">${ed?'Сохранить изменения':'Добавить в график'}</button>${ed?'':'<button data-a="osave" data-v="more">Добавить и ещё позицию в этот счёт</button>'}<button data-a="ocancel">Отмена</button></div></section>`}
function saveOrder(more){const o=S.o,ed=o.mode==='edit';const nw=Math.max(0,parseInt(o.nw)||0),rp=Math.max(0,parseInt(o.rp)||0);const cl=o.cl.trim();const num=o.num.trim();
if(!cl){S.oerr='Выберите клиента из списка или впишите нового';return render()}

if(num){const dup=P.find(p=>p.cl===cl&&p.num===num&&!p.cx&&p.id!==o.id);if(dup){S.oerr=`У клиента уже есть № ${num}: ${dup.nm}. Проверьте номер`;return render()}}
const isNewCl=cl!=='Склад'&&!clients().includes(cl);
const fields={inv:o.inv.trim(),cl,num,br:o.br.trim(),art:o.art.trim(),nm:o.nm.trim()||'Транспортер',nw,rp,qt:nw+rp,plan:o.plan};ZK.forEach(k=>fields[k]=o.z[k].trim());
if(ed){const p=byId(o.id);const ch=[];for(const k in fields){if(k==='qt')continue;const a=p[k]==null?'':String(p[k]),b=String(fields[k]);if(a!==b){const f=v=>v===''?'—':k==='plan'?fdy(v):v;ch.push(`${LBL[k]}: ${f(a)} → ${f(b)}`)}}
  if(ch.length){Object.assign(p,fields);p.h.push(ev('изменено — '+ch.join('; ')));touch(p)}S.ed=false;S.o=null;S.oerr='';S.toast={m:ch.length?`Сохранено, в истории: ${ch.length===1?'1 изменение':ch.length+' изм.'}`:'Изменений нет'};return render()}

S.hl=id;const vis=rows().some(x=>x.id===id);const nt=(isNewCl?` Новый клиент «${cl}» добавлен в справочник.`:'');
if(more){S.o=blankO({inv:fields.inv,cl,cnt:(o.cnt||0)+1});S.toast={m:`Добавлено: ${tag(p)}.${nt} Заполните следующую позицию этого счёта`}}
else{S.of=false;S.o=null;S.toast={m:`Позиция добавлена: ${tag(p)}, стадия «Принят».${nt}`+(vis?'':' Она скрыта текущими фильтрами'),sa:!vis}}

return can?`<button data-a="setst" data-v="${i}" class="${cls}"${ac} aria-label="Стадия ${s}">${inner}</button>`:`<div class="${cls}"${ac}>${inner}</div>`}).join('')}</div>`}

function vDetail(){const p=byId(S.d);if(!p){S.view=S.from;return paneMain()}const rt=route(p);const role=S.u.role;const adm=role==='admin';const can=!p.cx&&(adm||(role==='shift'&&p.st<6));

${S.toast?toastH():''}
<div class="dh"><div style="min-width:0"><h2 class="h2">${numB(p)}${esc(p.nm)}</h2><div class="mu">${esc(p.cl)} · ${esc(p.br||'—')} · арт. <span class="data">${esc(p.art||'—')}</span> · ${qtyTxt(p)}</div></div>
${adm&&!S.ed?`<div class="dact"><button data-a="edit">${ic('edit')} Изменить</button>${p.cx?'':`<button data-a="pri" class="${p.pri?'on-fl':''}">${ic('flag')} ${p.pri?'Снять «срочно»':'Срочно (офис)'}</button><button data-a="cxo" class="danger">${ic('ban')} Отменить позицию</button>`}</div>`:!adm&&prio(p)&&prod(p)?`<span class="pl on-fl">${ic('flag',13)} Приоритет${p.pri?': срочно (офис)':': просьба клиента'}</span>`:''}</div>
${p.cx?`<div class="box x"><span>${ic('ban')} Позиция отменена: ${esc(p.cx.r)}${p.cx.d?' · '+fd(p.cx.d)+', '+esc(p.cx.w):''}</span>${adm?'<button data-a="uncx" class="sm-btn">Вернуть в работу</button>':''}</div>`:''}
${S.cxo?`<div class="box x" style="display:block"><label class="lb" for="cxr" style="margin-top:0">Причина отмены — увидят офис и цех</label><input id="cxr" value="${esc(S.cxr)}" placeholder="Например: клиент отказался от ремонта">${S.cxe?`<div class="er">${esc(S.cxe)}</div>`:''}<div class="acts"><button data-a="cxok" class="danger solid">Отменить позицию</button><button data-a="cxno">Не отменять</button></div></div>`:''}
${r&&r.st==='new'&&prod(p)?`<div class="box w"><span>${ic('flag')} Клиент просит в первую очередь${r.need?', нужен к '+fd(r.need):''} · просьба от ${fd(r.d)} ${r.tm}</span>${adm?'<span class="bb"><button data-a="rqok" class="pri sm-btn">Принять</button><button data-a="rqno" class="sm-btn">Отклонить</button></span>':'<span class="sm">решает офис</span>'}</div>`:''}
${r&&r.st==='ok'&&prod(p)?`<div class="box g"><span>${ic('ok')} Приоритет по просьбе клиента, принят ${fd(r.ad)}${r.need?' · нужен к '+fd(r.need):''}</span>${adm?'<button data-a="rqoff" class="sm-btn">Снять приоритет</button>':''}</div>`:''}
${S.ed?orderForm():`<div class="kv">${kv('Клиент',p.cl)}${kv('№ счёта',p.inv,1)}${kv('Номер клиента',p.num,1)}${kv('Дата выдачи (план)',fdy(p.plan)+(over(p)?' · просрочено':''))}${!adm?kv('Срок для клиента',p.cd?fdy(p.cd):''):''}${kv('Готов к отгрузке',fdy(p.rd))}${kv('Дата реализации',p.sd?fdy(p.sd):p.sdx)}</div>
${adm&&prod(p)?`<div class="cdrow"><div><label class="lb" for="cdd">Срок для клиента</label><input type="date" id="cdd" value="${esc(S.cdd!=null?S.cdd:p.cd)}"></div><button data-a="cdsave">Сохранить срок</button><div class="sm">Клиент видит «ожидаем к …», только если дата впереди. План остаётся для офиса и цеха.</div></div>`:''}`}
<div class="sh"><span class="h3">Стадия · ${stLabel(p)} · ${PCT[p.st]}%</span><span class="sm">${can?'нажмите на стадию или «Дальше»':p.cx?'позиция отменена':'только просмотр'}</span></div>
${stepper(p,can)}
${S.cf&&S.cf.id===p.id?`<div class="cfb">${S.cf.to===5?'Перевести в «Готов»? Клиент увидит «Готов, можно забирать».':`Перескочить сразу в «${rt[S.cf.to]}»? Пропущенные стадии отметятся сегодняшним днём.`}<div class="acts"><button data-a="cfok" class="pri">Да, перевести</button><button data-a="cfno">Отмена</button></div></div>`:''}

${S.ed?'':`<h3 class="h3 mt">Замеры</h3><div class="kv">${ZK.filter(k=>k!=='al').map(k=>kv(LBL[k],p[k],k!=='jn'&&k!=='fs')).join('')}</div>${p.al?`<p class="alt"><span class="mu">Чередование:</span> ${esc(p.al)}</p>`:''}`}

/* ---------- клиенты и доступы ---------- */
function accCard(){const a=S.acc;const n=P.filter(p=>p.cl===a.name&&prod(p)).reduce((s,p)=>s+(p.qt||1),0);
const msg=a.client?`Здравствуйте${a.nm?', '+a.nm:''}!\nГотовность ваших транспортёров теперь видна онлайн: стадия и ожидаемая дата по каждому. Сейчас в производстве — ${n} шт.\nВход: [адрес кабинета]\nЛогин — ваш номер: ${fmtPh(a.ph)}\nПароль: ${a.pw}\nНужен вход агроному или механику — ответьте на это сообщение.\n${S.u.nm}, КД-Групп, ${fmtPh(S.u.ph)}`:`Доступ к графику производства КД-Групп.\nВход: [адрес кабинета]\nЛогин: ${fmtPh(a.ph)}\nПароль: ${a.pw}`;
return `<div class="acc"><div style="font-size:13px">${a.isNew?'Доступ создан':'Пароль сброшен'} · ${esc(a.name)}</div><div class="b1" style="font-size:15px;margin-top:4px">Логин <span class="data">${fmtPh(a.ph)}</span> · пароль <span class="data">${a.pw}</span></div><textarea id="msg" rows="8" readonly aria-label="Сообщение для отправки">${esc(msg)}</textarea><div class="row2"><button data-a="copy">${ic('copy')} Скопировать сообщение</button><span id="cpst" style="font-size:12px">${esc(S.cp||'Вставьте в мессенджер клиента. Пароль виден один раз, дальше только сброс. Адрес кабинета подставится, когда выберем домен')}</span></div></div>`}
function contact(u){const lst=u.last?'вход '+fd(u.last.slice(0,10))+' '+u.last.slice(11):'ещё не заходил';
if(S.rc===u.ph)return `<span class="ct"><span class="sm">Сбросить пароль ${fmtPh(u.ph)}? Старый перестанет работать.</span><button data-a="resetok" data-v="${u.ph}" class="sm-btn danger">Да, сбросить</button><button data-a="resetno" class="sm-btn">Отмена</button></span>`;
return `<span class="ct"><span class="data" style="font-size:13px">${fmtPh(u.ph)}</span><span class="sm">${esc(u.nm||'')}${u.nm?' · ':''}${lst}</span><button data-a="reset" data-v="${u.ph}" class="sm-btn">Сбросить пароль</button></span>`}

${S.aerr?`<div class="er">${esc(S.aerr)}</div>`:''}${S.acc&&S.acc.at==='form'?accCard():''}</section>
<div class="sh"><h2 class="h3">Клиенты · ${cls.length}</h2><div class="search" style="flex:0 1 300px">${ic('search')}<input id="acq" value="${esc(S.acq)}" placeholder="Найти клиента" aria-label="Найти клиента"></div></div>
${list.map(c=>{const us=U.filter(u=>u.cl===c);const pr=P.filter(p=>p.cl===c&&prod(p)).length,rd=P.filter(p=>p.cl===c&&p.st===5&&!p.cx).length,all=P.filter(p=>p.cl===c).length;
